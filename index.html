<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bon Voyage — Settlement Calculator</title>

<style>
  :root {
    --bg: #ffffff;
    --bg2: #f7f6f3;
    --bg3: #f1f1ef;
    --border: #e8e6e1;
    --text: #37352f;
    --text2: #787774;
    --text3: #9b9a97;
    --gold: #b8860b;
    --purple: #7F77DD;
    --purple-bg: #EEEDFE;
    --purple-text: #3C3489;
    --green: #1D9E75;
    --green-bg: #EAF3DE;
    --green-text: #27500A;
    --red: #E24B4A;
    --red-bg: #FCEBEB;
    --red-text: #A32D2D;
    --amber: #BA7517;
    --amber-bg: #FAEEDA;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 20px 40px;
    font-size: 14px;
  }

  .header { margin-bottom: 20px; }
  .brand { font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; }
  .title {  font-size: 24px; color: var(--text); margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: var(--text2); line-height: 1.5; }
  .divider { height: 0.5px; background: var(--border); margin: 16px 0; }

  .section-label { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }

  .travelers-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .field-wrap { }
  .field-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; font-weight: 500; }

  input[type=text], input[type=number], select {
    width: 100%;
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
    font-size: 13px;
    padding: 7px 10px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input:focus, select:focus {
    border-color: var(--purple);
    box-shadow: 0 0 0 2px rgba(127,119,221,0.12);
  }
  input::placeholder { color: var(--text3); }
  select { cursor: pointer; }

  .expense-header { display: grid; grid-template-columns: 2fr 90px 1fr 1fr 28px; gap: 6px; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 0.5px solid var(--border); }
  .expense-header span { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; }
  .expense-row { display: grid; grid-template-columns: 2fr 90px 1fr 1fr 28px; gap: 6px; margin-bottom: 6px; align-items: center; }

  .del-btn {
    width: 28px; height: 28px; border-radius: 5px; border: 0.5px solid var(--border);
    background: var(--bg2); color: var(--text3); font-size: 14px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0;
  }
  .del-btn:hover { background: var(--red-bg); color: var(--red); border-color: var(--red); }

  .add-btn {
    font-size: 12px; font-weight: 500; color: var(--green); background: var(--green-bg);
    border: 0.5px solid #c8e0b8; border-radius: 6px; padding: 6px 14px;
    cursor: pointer; transition: all 0.15s; margin-top: 8px; display: inline-block;
  }
  .add-btn:hover { border-color: var(--green); }

  .calc-btn {
    width: 100%; padding: 11px; margin: 18px 0 0;
    background: var(--purple);
    border: none; border-radius: 8px; color: white;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.15s;
  }
  .calc-btn:hover { background: #6b63c4; }

  .result { display: none; margin-top: 20px; }
  .result.visible { display: block; }

  .stat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 16px; }
  .stat-box { background: var(--bg2); border: 0.5px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
  .stat-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; font-weight: 500; }
  .stat-value {  font-size: 22px; color: var(--text); }

  .card { border: 0.5px solid var(--border); border-radius: 8px; padding: 0 14px; margin-bottom: 12px; }
  .person-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 0.5px solid var(--border); }
  .person-row:last-child { border-bottom: none; }
  .person-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .person-detail { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .balance-tag { font-size: 12px; font-weight: 500; padding: 3px 10px; border-radius: 20px; }
  .balance-pos { background: var(--green-bg); color: var(--green-text); }
  .balance-neg { background: var(--red-bg); color: var(--red-text); }
  .balance-zero { background: var(--bg2); color: var(--text3); }

  .settlement-box { background: var(--purple-bg); border: 0.5px solid rgba(127,119,221,0.3); border-radius: 8px; padding: 14px; margin: 12px 0; }
  .settlement-title { font-size: 11px; font-weight: 600; color: var(--purple-text); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 12px; }
  .settlement-item { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13px; }
  .settlement-item:last-child { margin-bottom: 0; }
  .s-from, .s-to { font-weight: 600; color: var(--text); }
  .s-arrow { color: var(--text3); }
  .s-amount { background: var(--purple); color: white; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; margin-left: auto; }
  .even-msg { font-size: 13px; color: var(--green-text); font-weight: 500; }

  .cat-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 0.5px solid var(--border); }
  .cat-row:last-child { border-bottom: none; }
  .cat-name { font-size: 12px; flex: 1; color: var(--text); }
  .cat-bar-bg { width: 70px; height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
  .cat-bar-fill { height: 100%; border-radius: 2px; background: var(--purple); }
  .cat-amount { font-size: 12px; font-weight: 600; color: var(--text); min-width: 50px; text-align: right; }

  .footer { text-align: center; margin-top: 24px; font-size: 11px; color: var(--text3); }

  @media (max-width: 480px) {
    .travelers-grid { grid-template-columns: 1fr 1fr; }
    .expense-header, .expense-row { grid-template-columns: 1.5fr 80px 1fr 28px; }
    .expense-header span:nth-child(4), .expense-row select:last-of-type { display: none; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="brand">Bon Voyage</div>
  <h1 class="title">Settlement Calculator</h1>
  <p class="subtitle">Log expenses below — instantly see who owes who. No math required.</p>
</div>
<div class="divider"></div>

<div class="section-label">Travelers</div>
<div class="travelers-grid">
  <div class="field-wrap"><div class="field-label">Traveler 1</div><input type="text" id="t1" value="Marie-Lou" placeholder="Name"></div>
  <div class="field-wrap"><div class="field-label">Traveler 2</div><input type="text" id="t2" value="Jean-Félix" placeholder="Name"></div>
  <div class="field-wrap"><div class="field-label">Traveler 3 (optional)</div><input type="text" id="t3" value="" placeholder="Name"></div>
</div>

<div class="divider"></div>
<div class="section-label">Expenses</div>
<div class="expense-header">
  <span>Description</span><span>Amount $</span><span>Paid by</span><span>Category</span><span></span>
</div>
<div id="expense-list"></div>
<button class="add-btn" onclick="addRow()">+ Add expense</button>

<button class="calc-btn" onclick="calculate()">⚡ Calculate settlement</button>

<div class="result" id="result">
  <div class="divider"></div>
  <div class="section-label">Summary</div>
  <div class="stat-grid" id="stat-grid"></div>

  <div class="section-label">Per person</div>
  <div class="card"><div id="person-breakdown"></div></div>

  <div class="settlement-box">
    <div class="settlement-title">Who pays who</div>
    <div id="settlement-items"></div>
  </div>

  <div class="section-label">By category</div>
  <div class="card"><div id="category-list"></div></div>
</div>

<div class="footer">Bon Voyage · Plan it together. Remember it forever.</div>

<script>
let rowId=1;
const categories=['🚇 Transport','🏨 Lodging','🍜 Food','🎟 Activities','🛍 Shopping','🏥 Health','📦 Misc'];
const sampleData=[
  {name:'✈️ Flights YUL→KIX',amount:660,paidBy:'Marie-Lou',cat:'🚇 Transport'},
  {name:'🏨 Airbnb Kyoto',amount:270,paidBy:'Jean-Félix',cat:'🏨 Lodging'},
  {name:'🍜 Nishiki Market',amount:42,paidBy:'Marie-Lou',cat:'🍜 Food'},
  {name:'🎟 TeamLab Planets',amount:64,paidBy:'Marie-Lou',cat:'🎟 Activities'},
];

function getTravelers(){
  return ['t1','t2','t3'].map(id=>document.getElementById(id).value.trim()).filter(t=>t);
}

function addRow(data={}){
  const travelers=getTravelers();
  const div=document.createElement('div');
  div.className='expense-row'; div.dataset.id=rowId++;
  div.innerHTML=`
    <input type="text" placeholder="e.g. 🍜 Dinner" value="${data.name||''}">
    <input type="number" placeholder="0.00" value="${data.amount||''}" min="0" step="0.01">
    <select>${travelers.map(t=>`<option${t===(data.paidBy||travelers[0])?' selected':''}>${t}</option>`).join('')}</select>
    <select>${categories.map(c=>`<option${c===(data.cat||categories[0])?' selected':''}>${c}</option>`).join('')}</select>
    <button class="del-btn" onclick="if(document.querySelectorAll('.expense-row').length>1)this.closest('.expense-row').remove()">×</button>`;
  document.getElementById('expense-list').appendChild(div);
}

function updateSelects(){
  const travelers=getTravelers();
  document.querySelectorAll('#expense-list .expense-row').forEach(row=>{
    const sel=row.querySelectorAll('select')[0];
    const cur=sel.value;
    sel.innerHTML=travelers.map(t=>`<option${t===cur?' selected':''}>${t}</option>`).join('');
  });
}
['t1','t2','t3'].forEach(id=>document.getElementById(id).addEventListener('input',updateSelects));

function calculate(){
  const travelers=getTravelers();
  if(travelers.length<2){alert('Please enter at least 2 traveler names.');return;}
  const rows=document.querySelectorAll('#expense-list .expense-row');
  const expenses=[];
  rows.forEach(row=>{
    const inp=row.querySelectorAll('input');
    const sel=row.querySelectorAll('select');
    const name=inp[0].value.trim();
    const amount=parseFloat(inp[1].value);
    if(!name||isNaN(amount)||amount<=0)return;
    expenses.push({name,amount,paidBy:sel[0].value,category:sel[1].value});
  });
  if(!expenses.length){alert('Please add at least one expense.');return;}

  const n=travelers.length;
  const total=expenses.reduce((s,e)=>s+e.amount,0);
  const share=total/n;
  const paid={};
  travelers.forEach(t=>paid[t]=0);
  expenses.forEach(e=>{paid[e.paidBy]=(paid[e.paidBy]||0)+e.amount;});
  const balance={};
  travelers.forEach(t=>{balance[t]=(paid[t]||0)-share;});

  const settlements=[];
  const pos=travelers.filter(t=>balance[t]>0.005).map(t=>({name:t,amt:balance[t]}));
  const neg=travelers.filter(t=>balance[t]<-0.005).map(t=>({name:t,amt:-balance[t]}));
  let i=0,j=0;
  while(i<pos.length&&j<neg.length){
    const tr=Math.min(pos[i].amt,neg[j].amt);
    if(tr>0.005)settlements.push({from:neg[j].name,to:pos[i].name,amount:tr});
    pos[i].amt-=tr;neg[j].amt-=tr;
    if(pos[i].amt<0.005)i++;if(neg[j].amt<0.005)j++;
  }

  const cats={};
  expenses.forEach(e=>{cats[e.category]=(cats[e.category]||0)+e.amount;});
  const maxCat=Math.max(...Object.values(cats));

  document.getElementById('stat-grid').innerHTML=`
    <div class="stat-box"><div class="stat-label">Total spent</div><div class="stat-value">$${total.toFixed(2)}</div></div>
    <div class="stat-box"><div class="stat-label">Per person</div><div class="stat-value">$${share.toFixed(2)}</div></div>
    <div class="stat-box"><div class="stat-label">Transfers</div><div class="stat-value">${settlements.length}</div></div>`;

  document.getElementById('person-breakdown').innerHTML=travelers.map(t=>{
    const b=balance[t];
    const cls=b>0.005?'balance-pos':b<-0.005?'balance-neg':'balance-zero';
    const label=b>0.005?`Gets back $${b.toFixed(2)}`:b<-0.005?`Owes $${Math.abs(b).toFixed(2)}`:'Even ✓';
    return `<div class="person-row">
      <div><div class="person-name">${t}</div><div class="person-detail">Paid $${(paid[t]||0).toFixed(2)} · Share $${share.toFixed(2)}</div></div>
      <div class="balance-tag ${cls}">${label}</div>
    </div>`;
  }).join('');

  document.getElementById('settlement-items').innerHTML=settlements.length?
    settlements.map(s=>`<div class="settlement-item"><span class="s-from">${s.from}</span><span class="s-arrow">→</span><span class="s-to">${s.to}</span><span class="s-amount">$${s.amount.toFixed(2)}</span></div>`).join(''):
    '<div class="even-msg">✅ Everyone is even — no transfers needed!</div>';

  document.getElementById('category-list').innerHTML=Object.entries(cats)
    .sort((a,b)=>b[1]-a[1])
    .map(([cat,amt])=>`<div class="cat-row"><span class="cat-name">${cat}</span><div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${(amt/maxCat*100).toFixed(0)}%"></div></div><span class="cat-amount">$${amt.toFixed(2)}</span></div>`).join('');

  document.getElementById('result').classList.add('visible');
  document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'});
}

sampleData.forEach(d=>addRow(d));
</script>
</body>
</html>
